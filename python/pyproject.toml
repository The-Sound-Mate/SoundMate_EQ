[project]
name = "soundmate-eq"
version = "0.1.0"
description = "Music analysis-based EQ recommendation system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mj" }]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# essentia has no official Windows wheels — install only where supported
# (Linux / macOS / WSL).  When absent, TempoExtractor falls back to librosa.
essentia = ["essentia>=2.1b6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# The project itself is an application, not a distributable library.
# uv will manage dependencies but will not build/install the source tree.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
